services:
  - type: web
    name: race-overlay
    runtime: node
    plan: starter            # always-on (~$7/mo, prorated) — no sleeping
    region: frankfurt         # closest to the race (EU)
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Secrets — entered in the Render dashboard, NOT stored in this public repo:
      - key: PAJ_EMAIL
        sync: false
      - key: PAJ_PASSWORD
        sync: false
      - key: HR_TOKEN
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      # Non-secret config (safe to keep here):
      - key: PAJ_DEVICE_ID
        value: "1011413503"
      - key: PAJ_POLL_MS
        value: "15000"
      - key: ROUTE_TOTAL_KM
        value: "206.32"
      - key: RACE_START_ISO
        value: "2026-10-22T06:00:00+02:00"
