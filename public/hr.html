<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>HR Relay</title>
  <style>
    :root { --red:#ff3b4e; --ok:#35d07f; --warn:#feb60e; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { margin:0; min-height:100vh; background:#0b0d12; color:#fff;
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      display:flex; flex-direction:column; align-items:center; padding:20px; }
    h1 { font-size:15px; letter-spacing:2px; color:#8a93a6; text-transform:uppercase; margin:6px 0 2px; }
    .bpm { font-size:140px; font-weight:800; line-height:1; margin:14px 0 2px; font-variant-numeric:tabular-nums;
      color:var(--red); display:flex; align-items:center; gap:14px; }
    .bpm .heart { font-size:70px; animation:pulse 1s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 18%{transform:scale(1.25)} 40%{transform:scale(1)} }
    .unit { font-size:22px; color:#8a93a6; letter-spacing:2px; margin-bottom:22px; }
    button { background:var(--red); color:#fff; border:0; border-radius:14px; padding:18px 30px;
      font-size:20px; font-weight:700; width:100%; max-width:420px; margin:8px 0; }
    button.sec { background:#242a36; }
    .row { width:100%; max-width:420px; }
    input { width:100%; background:#11141b; border:1px solid #2a3140; color:#fff;
      border-radius:10px; padding:13px; font-size:15px; margin:6px 0; }
    .card { width:100%; max-width:420px; background:#11141b; border:1px solid #1f2633;
      border-radius:14px; padding:14px 16px; margin-top:14px; font-size:14px; }
    .stat { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #1b2130; }
    .stat:last-child { border:0; }
    .k { color:#8a93a6; }
    .pill { padding:2px 10px; border-radius:20px; font-weight:700; font-size:12px; background:#2a2f3a; }
    .pill.ok { background:#12402b; color:var(--ok); }
    .pill.bad { background:#3f1512; color:var(--red); }
    .pill.warn { background:#403612; color:var(--warn); }
    #log { font-family:ui-monospace,Menlo,monospace; font-size:11px; height:120px; overflow:auto;
      background:#0b0d12; border:1px solid #1f2633; border-radius:10px; padding:8px; margin-top:12px; width:100%; max-width:420px; color:#7f8ba0; }
    .hint { color:#6b7688; font-size:12px; max-width:420px; text-align:center; margin-top:14px; line-height:1.5; }
  </style>
</head>
<body>
  <h1>Peak Pixel Cafe · Heart-Rate Relay</h1>
  <div class="bpm"><span class="heart" id="heart">❤</span><span id="bpm">--</span></div>
  <div class="unit">BPM</div>

  <button id="connect">Connect heart-rate sensor</button>
  <button id="disconnect" class="sec" style="display:none">Disconnect</button>

  <div class="row">
    <input id="token" placeholder="relay token (HR_TOKEN)" />
  </div>

  <div class="card">
    <div class="stat"><span class="k">Sensor</span><span class="pill" id="s_dev">not connected</span></div>
    <div class="stat"><span class="k">Bluetooth</span><span class="pill" id="s_ble">—</span></div>
    <div class="stat"><span class="k">Sending to server</span><span class="pill" id="s_net">—</span></div>
    <div class="stat"><span class="k">Screen kept awake</span><span class="pill" id="s_wake">—</span></div>
  </div>

  <div id="log"></div>
  <div class="hint">Keep this page open and in the foreground during the race.
    Plug the phone into power, turn off battery saver, and enable Do&nbsp;Not&nbsp;Disturb.</div>

  <script src="hr.js"></script>
</body>
</html>
