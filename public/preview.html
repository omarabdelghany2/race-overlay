<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Overlay preview</title>
  <style>
    html,body{margin:0;width:1920px;height:1080px;overflow:hidden;}
    /* stand-in for the Twitch video feed so you can judge contrast/legibility */
    .bg{position:absolute;inset:0;
      background:
        radial-gradient(1200px 700px at 70% 20%, #3a5a40, #1b2a21 60%, #0c130f 100%);}
    .bg::after{content:"";position:absolute;inset:0;
      background:linear-gradient(120deg, rgba(255,255,255,.06) 0 2px, transparent 2px 60px);
      opacity:.4;}
    iframe{position:absolute;inset:0;width:1920px;height:1080px;border:0;background:transparent;}
  </style>
</head>
<body>
  <div class="bg"></div>
  <iframe src="/"></iframe>
</body>
</html>
